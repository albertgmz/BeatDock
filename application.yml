server:
  port: 2333
  address: 0.0.0.0
  undertow:
    threads:
      io: 4
      worker: 8

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # Order is load-bearing: youtube-source walks this list until a client succeeds.
      # MUSIC never serves a stream (metadata only), so IOS is the first playback-capable one.
      - MUSIC          # ytmsearch / music catalog — metadata only
      - IOS            # primary stream provider; needs no poToken (requires the snapshot pin below)
      - WEB            # arbitrary videos + RD mixes (needs poToken, pushed by pot-refresher)
      - WEBEMBEDDED    # embed / age-limited fallback (also uses poToken)
      - ANDROID_VR     # credential-free safety net if the poToken is momentarily unavailable
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
      - "spsearch:%QUERY%"
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 3
      albumLoadLimit: 3

lavalink:
  plugins:
    # TEMPORARY pin: no release has the IOS client fixes yet, and without them YouTube plays
    # nothing. Bare commit hash, no "-SNAPSHOT" suffix - Lavalink builds the jar URL literally.
    # If tracks repeat or restart, drop back to 34ee4c5f6b4608c19880ff62f80540c0048f537e.
    # Revert to a release once one carries them, and keep EXPECTED_PLUGINS in
    # src/utils/nodePluginCheck.js in sync: https://github.com/lavalink-devs/youtube-source/releases
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: false
      local: false
    bufferDurationMs: 200
    frameBufferDurationMs: 1000
    youtubePlaylistLoadLimit: 3
    playerUpdateInterval: 2
    trackStuckThresholdMs: 5000
    useSeekGhosting: true
    ratelimit:
      ipBlocks: []
      excludedIps: []
      strategy: "RotateOnBan"
      searchTriggersFail: true
      retryLimit: 5
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      lowpass: true

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-history: 3
      max-file-size: 10MB
